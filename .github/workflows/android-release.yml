# Builds signed APK + AAB for every new app version and publishes them as a GitHub release.
#   push to android-beta   -> pre-release  v<versionName>-beta  (de.paul42.mayfly.beta)
#   push to android-stable -> release      v<versionName>       (de.paul42.mayfly)
# A push without a new versionName (release tag already exists) builds nothing.
# To rebuild a version, delete its release + tag on GitHub and re-run the workflow.
name: Android release

on:
  push:
    branches: [android-beta, android-stable]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == 'android-beta' || github.ref_name == 'android-stable'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version
        id: ver
        run: |
          name=$(sed -nE 's/^[[:space:]]*versionName "([^"]+)".*/\1/p' android/app/build.gradle)
          code=$(sed -nE 's/^[[:space:]]*versionCode ([0-9]+).*/\1/p' android/app/build.gradle)
          if [ -z "$name" ] || [ -z "$code" ]; then echo "version not found in build.gradle" >&2; exit 1; fi
          if [ "$GITHUB_REF_NAME" = android-stable ]; then
            channel=stable; tag="v$name"; pkg=de.paul42.mayfly; task=Release; variant=release
          else
            channel=beta; tag="v$name-beta"; pkg=de.paul42.mayfly.beta; task=Beta; variant=beta
          fi
          exists=false
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exists=true; fi
          {
            echo "name=$name"; echo "code=$code"; echo "channel=$channel"; echo "tag=$tag"
            echo "pkg=$pkg"; echo "task=$task"; echo "variant=$variant"; echo "exists=$exists"
          } >> "$GITHUB_OUTPUT"
          echo "Mayfly $name ($code), channel $channel, tag $tag, already released: $exists"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.ver.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.ver.outputs.exists == 'false'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.ver.outputs.exists == 'false'
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        if: steps.ver.outputs.exists == 'false'
        # lockfile = exactly what the local builds use; react-native-get-random-values 2.x declares an RN >=0.81 peer
        # no install scripts: the only ones are fsevents (macOS) and a broken "bob build" postinstall in react-native-screens 3.31.0
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Restore signing key
        if: steps.ver.outputs.exists == 'false'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/mayfly-release.jks
          {
            echo "storeFile=mayfly-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build APK + AAB
        if: steps.ver.outputs.exists == 'false'
        working-directory: android
        run: ./gradlew --no-daemon assemble${{ steps.ver.outputs.task }} bundle${{ steps.ver.outputs.task }}

      - name: Collect artifacts
        if: steps.ver.outputs.exists == 'false'
        id: out
        run: |
          set -e
          v=${{ steps.ver.outputs.variant }}; pkg=${{ steps.ver.outputs.pkg }}; code=${{ steps.ver.outputs.code }}
          mkdir dist
          cp "android/app/build/outputs/apk/$v/app-$v.apk"     "dist/${pkg}_${code}.apk"
          cp "android/app/build/outputs/bundle/$v/app-$v.aab"  "dist/${pkg}_${code}.aab"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          cert=$("$apksigner" verify --print-certs "dist/${pkg}_${code}.apk" | sed -nE 's/.*certificate SHA-256 digest: ([0-9a-f]+).*/\1/p' | head -1)
          [ -n "$cert" ] || { echo "APK signature check failed" >&2; exit 1; }
          (cd dist && sha256sum * > SHA256SUMS)
          echo "cert=$cert" >> "$GITHUB_OUTPUT"

      - name: Remove signing key
        if: always()
        run: rm -f android/app/mayfly-release.jks android/keystore.properties

      - name: Publish GitHub release
        if: steps.ver.outputs.exists == 'false'
        run: |
          name=${{ steps.ver.outputs.name }}; code=${{ steps.ver.outputs.code }}; pkg=${{ steps.ver.outputs.pkg }}
          pre=""; title="Mayfly $name"
          if [ "${{ steps.ver.outputs.channel }}" = beta ]; then pre="--prerelease"; title="Mayfly $name (Beta)"; fi
          cat > notes.md <<NOTES
          Package \`$pkg\`, versionCode $code, built from ${GITHUB_SHA:0:7}.

          - \`${pkg}_${code}.apk\`: install directly on Android
          - \`${pkg}_${code}.aab\`: Android App Bundle
          - \`SHA256SUMS\`: checksums

          Signing certificate SHA-256: \`${{ steps.out.outputs.cert }}\`
          (same key as the F-Droid builds, so both install as updates of each other)
          NOTES
          gh release create "${{ steps.ver.outputs.tag }}" dist/* -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$title" --notes-file notes.md $pre
